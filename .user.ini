; Example Settings
error_reporting = E_ALL & ~E_DEPRECATED
display_errors = On
display_startup_errors = On

memory_limit = "256M"
upload_max_filesize = "50M"
max_execution_time="120"
max_input_time="120"
post_max_size="400M"

max_input_nesting_level="64"
max_input_vars="100000"
max_file_uploads="30"
